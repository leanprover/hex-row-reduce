name = "hex-row-reduce-conformance"
defaultTargets = ["HexRowReduceConformance", "hexrowreduce_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexRowReduce"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "36e7d67fc3a511ca9d69f360def6e50769e439d4"

[[lean_lib]]
name = "HexRowReduceConformance"
globs = ["HexRowReduce.Conformance"]

[[lean_exe]]
name = "hexrowreduce_emit_fixtures"
root = "HexRowReduce.EmitFixtures"
